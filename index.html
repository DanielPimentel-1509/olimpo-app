<style>
  :root{
    --bg:#09060F; --panel:#120C1E; --panel-2:#180F29; --panel-3:#1E1433;
    --line:rgba(140,110,255,.16); --line-strong:rgba(157,123,255,.32);
    --violet:#9D7BFF; --violet-bright:#B79CFF; --violet-deep:#5B3FCF;
    --text:#ECE8F7; --muted:#9A90B6; --dim:#6E6488;
    --glow:rgba(124,92,255,.5); --ok:#7BE0B0;
    --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.5; overflow-x:hidden;
    background-image:radial-gradient(120% 55% at 50% -8%, rgba(91,63,207,.26), transparent 60%); background-attachment:fixed;}
  .app{max-width:480px; margin:0 auto; padding:0 16px calc(100px + env(safe-area-inset-bottom))}
  .ey{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--violet); font-weight:700; display:flex; align-items:center; gap:8px}
  .ey::before{content:""; width:5px; height:5px; background:var(--violet); box-shadow:0 0 8px var(--glow); border-radius:1px; flex:none}
  .mut{color:var(--muted)} .dim{color:var(--dim)}

  .top{display:flex; align-items:center; justify-content:space-between; padding:calc(18px + env(safe-area-inset-top)) 2px 14px; position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg) 62%, transparent)}
  .brand{display:flex; align-items:center; gap:9px}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--violet-bright); box-shadow:0 0 0 4px rgba(124,92,255,.12),0 0 16px var(--glow); animation:pulse 2.6s ease-in-out infinite}
  .brand h1{font-size:19px; font-weight:700; letter-spacing:.12em}
  .badge{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--violet-bright); border:.5px solid var(--line-strong); border-radius:100px; padding:5px 11px; display:flex; align-items:center; gap:6px}
  .badge b{color:#fff; font-weight:700}

  h2.view-t{font-size:24px; font-weight:700; letter-spacing:.01em; margin:2px 0 3px}
  .view-s{font-size:13px; color:var(--muted); margin-bottom:14px}

  .card{position:relative; background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:.5px solid var(--line); border-radius:15px; padding:16px; margin-bottom:12px}
  .card.acc{border-color:var(--line-strong)}
  .card.acc::before{content:""; position:absolute; top:-1px; left:-1px; width:12px; height:12px; border:1.5px solid var(--violet); border-right:0; border-bottom:0; border-top-left-radius:15px; opacity:.6}
  .card.acc::after{content:""; position:absolute; bottom:-1px; right:-1px; width:12px; height:12px; border:1.5px solid var(--violet); border-left:0; border-top:0; border-bottom-right-radius:15px; opacity:.6}
  .c-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}

  .btn{font-family:var(--sans); font-size:14px; font-weight:500; color:var(--text); background:rgba(124,92,255,.08); border:.5px solid var(--line-strong); border-radius:10px; padding:11px 14px; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:8px}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--violet-deep); border-color:var(--violet); color:#fff; box-shadow:0 0 20px rgba(124,92,255,.28)}
  .btn.sm{padding:8px 11px; font-size:12.5px; border-radius:9px}
  .btn.gho{background:transparent}
  .btn.full{width:100%}
  .pill{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--violet); border:.5px solid var(--line); border-radius:100px; padding:5px 10px; background:transparent; cursor:pointer}
  .pill.on{background:rgba(124,92,255,.16); border-color:var(--violet); color:#fff}
  input,select{font-family:var(--mono); font-size:14px; color:#fff; background:var(--panel-3); border:.5px solid var(--line-strong); border-radius:9px; padding:10px 12px; width:100%; outline:none}
  input:focus{border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  input::placeholder{color:var(--dim)}

  .today-hd{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
  .today-hd .dn{font-size:34px; font-weight:700; line-height:1; letter-spacing:.02em}
  .today-hd .dk{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--violet)}
  .today-hd .ds{font-size:12px; color:var(--muted); margin-top:5px}
  .cyc-dots{display:flex; gap:6px; margin-top:12px}
  .cyc-dots i{flex:1; height:5px; border-radius:100px; background:rgba(124,92,255,.16)}
  .cyc-dots i.on{background:var(--violet-bright); box-shadow:0 0 8px var(--glow)}
  .warm{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--muted); padding:9px 0}
  .warm .k{font-family:var(--mono); font-size:11px; color:var(--violet); flex:none; width:16px}
  .base-log{display:flex; align-items:center; gap:8px; padding:9px 0; border-top:.5px solid var(--line)}
  .base-log:first-child{border-top:0}
  .base-log .bn{flex:1; font-size:14px; color:#fff}
  .base-log .bv{font-family:var(--mono); font-size:12px; color:var(--violet-bright)}
  .exrow{display:flex; align-items:center; gap:11px; padding:11px 0; border-top:.5px solid var(--line)}
  .exrow:first-child{border-top:0}
  .chk{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-strong); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:transparent; font-size:13px}
  .chk.on{background:var(--violet-deep); border-color:var(--violet); color:#fff}
  .exrow .en{flex:1; font-size:14px}
  .exrow.done .en{color:var(--dim); text-decoration:line-through}
  .exrow .eg{font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim)}
  .empty{text-align:center; color:var(--dim); font-size:13px; padding:16px 8px; line-height:1.6}

  .search{margin-bottom:12px}
  .grp-nav{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 10px; margin:0 -16px; scrollbar-width:none}
  .grp-nav::-webkit-scrollbar{display:none}
  .grp-nav .pill{flex:none; white-space:nowrap}
  .lib-row{display:flex; align-items:flex-start; gap:11px; padding:12px 0; border-top:.5px solid var(--line)}
  .lib-row:first-child{border-top:0}
  .star{font-size:19px; flex:none; cursor:pointer; color:var(--dim); line-height:1.3}
  .star.on{color:#F5C451}
  .lib-row .li{flex:1; min-width:0}
  .lib-row .ln{font-size:14.5px; color:#fff}
  .lib-row .la{font-size:11px; color:var(--dim); font-family:var(--mono); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .lib-row .lt{font-size:11.5px; color:var(--muted); margin-top:3px}
  .tagline{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap}
  .minitag{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--violet); border:.5px solid var(--line); border-radius:5px; padding:3px 6px}
  .minitag.base{color:#fff; border-color:var(--violet); background:rgba(124,92,255,.14)}

  .rings-row{display:flex; justify-content:space-between; gap:5px; margin:2px 0 6px}
  .ringc{flex:1; text-align:center}
  .ringc svg{width:100%; max-width:62px; height:auto; display:block; margin:0 auto}
  .ringc .rl{font-family:var(--mono); font-size:8px; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); margin-top:6px}
  .ringc .rp{font-family:var(--mono); font-size:9px; color:var(--violet-bright)}
  .lvl{display:flex; align-items:center; gap:12px}
  .lvl .lc{width:52px; height:52px; border-radius:50%; border:1.5px solid var(--violet); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; box-shadow:0 0 18px rgba(124,92,255,.2)}
  .lvl .ln{font-size:19px; font-weight:700; color:#fff}
  .lvl .lx{font-family:var(--mono); font-size:11px; color:var(--muted)}
  .bar{height:6px; border-radius:100px; background:rgba(124,92,255,.14); overflow:hidden; margin-top:8px}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--violet-deep),var(--violet-bright)); border-radius:100px}
  .cycbig{display:flex; align-items:center; gap:14px}
  .cycbig .num{font-size:40px; font-weight:700; line-height:1; color:#fff}
  .cycbig .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--violet)}
  .seg{display:flex; gap:5px; margin-top:9px}
  .seg i{flex:1; height:7px; border-radius:100px; background:rgba(124,92,255,.16)}
  .seg i.on{background:var(--violet-bright); box-shadow:0 0 8px var(--glow)}
  .skill{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:.5px solid var(--line)}
  .skill:first-child{border-top:0}
  .skill .sn{flex:1; font-size:14px}
  .sstate{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; border:.5px solid var(--line-strong); border-radius:100px; padding:5px 10px; cursor:pointer; color:var(--muted)}
  .sstate.wip{color:var(--violet-bright); border-color:var(--violet)}
  .sstate.done{color:var(--ok); border-color:rgba(123,224,176,.4); background:rgba(123,224,176,.08)}

  .cal-hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .cal-hd .cm{font-size:22px; font-weight:700}
  .cal-hd .cy{font-family:var(--mono); font-size:9.5px; color:var(--dim); letter-spacing:.06em; margin-top:3px}
  .nav-b{width:38px; height:38px; border-radius:10px; border:.5px solid var(--line-strong); background:transparent; color:var(--violet); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px}
  .dow span{font-family:var(--mono); font-size:9px; text-align:center; color:var(--dim); text-transform:uppercase}
  .cgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
  .cd{aspect-ratio:1; border-radius:8px; border:.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-family:var(--mono); color:var(--muted); cursor:pointer; transition:.12s}
  .cd:active{transform:scale(.9)}
  .cd .num{font-size:12px}
  .cd .cmp{font-size:7px; letter-spacing:.04em; color:var(--violet-bright); line-height:1}
  .cd.tr{background:var(--violet-deep); border-color:var(--violet); color:#fff}
  .cd.tr .cmp{color:#fff}
  .cd.tod{border-color:var(--violet-bright); box-shadow:0 0 10px rgba(124,92,255,.3)}
  .legend{display:flex; gap:12px; justify-content:center; margin-top:12px; font-family:var(--mono); font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; flex-wrap:wrap}
  .ystrip{display:flex; flex-direction:column; gap:8px; margin-top:6px}
  .yrow{display:flex; align-items:center; gap:9px}
  .yrow .ym{font-family:var(--mono); font-size:11px; width:96px; flex:none; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .yrow .ym.sol{color:var(--violet-bright)}
  .ybar{flex:1; height:8px; border-radius:100px; background:rgba(124,92,255,.1); overflow:hidden}
  .ybar i{display:block; height:100%; background:var(--violet); border-radius:100px}
  .yrow .yc{font-family:var(--mono); font-size:10px; color:var(--dim); width:20px; text-align:right}

  .nav{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; padding:0 0 env(safe-area-inset-bottom)}
  .nav-in{display:flex; gap:2px; background:rgba(18,12,30,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:.5px solid var(--line-strong); border-radius:16px; padding:6px; margin:0 16px 12px; width:100%; max-width:448px}
  .nav-b2{flex:1; background:transparent; border:0; cursor:pointer; padding:9px 2px; border-radius:11px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--dim); font-family:var(--sans)}
  .nav-b2 .ic{font-size:19px; line-height:1}
  .nav-b2 span{font-size:9.5px}
  .nav-b2.on{color:#fff; background:rgba(124,92,255,.16)}
  .nav-b2.on .ic{filter:drop-shadow(0 0 8px var(--glow))}

  .toast{position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--panel-3); border:.5px solid var(--violet); color:#fff; font-size:13px; padding:11px 18px; border-radius:100px; z-index:50; box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 20px rgba(124,92,255,.3); opacity:0; transition:.25s; pointer-events:none; text-align:center; max-width:88%}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
  .modal-overlay{position:fixed; inset:0; background:rgba(6,4,12,.72); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fd .2s ease}
  .modal-sheet{width:100%; max-width:480px; background:linear-gradient(180deg,var(--panel),var(--panel-2)); border:.5px solid var(--line-strong); border-top-left-radius:20px; border-top-right-radius:20px; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:86vh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  .setrow{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .setrow input{flex:1}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.16);opacity:.7}}
  .fade{animation:fd .35s ease}
  @keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* Splash · entrada al Olimpo */
  #splash{position:fixed;inset:0;z-index:9999;background:var(--bg);background-image:radial-gradient(80% 50% at 50% 42%,rgba(91,63,207,.32),transparent 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s;cursor:pointer}
  #splash.hide{opacity:0;visibility:hidden}
  #splash .sdot{width:26px;height:26px;border-radius:50%;background:var(--violet-bright);box-shadow:0 0 0 6px rgba(124,92,255,.10),0 0 30px 6px var(--glow),0 0 70px 12px rgba(124,92,255,.35);opacity:0;transform:scale(.3);animation:sdotIn 1s .1s cubic-bezier(.2,.8,.2,1) forwards,sBreath 2.8s 1.1s ease-in-out infinite}
  #splash .stitle{font-family:var(--sans);font-weight:700;font-size:46px;letter-spacing:.28em;color:#fff;margin-top:22px;padding-left:.28em;opacity:0;transform:translateY(14px);animation:sUp .9s .55s ease forwards;text-shadow:0 0 30px rgba(124,92,255,.45)}
  #splash .sline{width:0;height:1px;margin-top:20px;background:linear-gradient(90deg,transparent,var(--violet),transparent);animation:sLine 1.1s 1s ease forwards}
  #splash .ssub{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--violet);margin-top:16px;opacity:0;animation:sFade 1s 1.2s ease forwards}
  @keyframes sdotIn{to{opacity:1;transform:scale(1)}}
  @keyframes sBreath{0%,100%{box-shadow:0 0 0 6px rgba(124,92,255,.10),0 0 30px 6px var(--glow),0 0 70px 12px rgba(124,92,255,.35)}50%{box-shadow:0 0 0 11px rgba(124,92,255,.05),0 0 46px 12px var(--glow),0 0 110px 20px rgba(124,92,255,.5)}}
  @keyframes sUp{to{opacity:1;transform:none}}
  @keyframes sFade{to{opacity:1}}
  @keyframes sLine{to{width:130px}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}.brand .dot{animation:none}#splash .sdot,#splash .stitle,#splash .ssub{animation:none;opacity:1;transform:none}#splash .sline{animation:none;width:130px}}
</style>
</head>
<body>
<div id="splash"><div class="sdot"></div><div class="stitle">OLIMPO</div><div class="sline"></div><div class="ssub">Brick by brick</div></div>

<script>

var DB={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return (k in MEM)?MEM[k]:d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){MEM[k]=v;}}};

var CYCLE=[
  {k:'empuje',n:'Empuje',i:'E',groups:['Pecho','Hombros','Tríceps'],base:['Fondos con lastre','Press'],sub:'Pecho · hombro (post.) · tríceps',ql:['F','U']},

];

var BASE=[{k:'dips',n:'Fondos (dips)',u:'reps'},{k:'pullups',n:'Dominadas',u:'reps'},{k:'squat',n:'Sentadilla',u:'kg'},{k:'ohp',n:'Press militar',u:'kg'},{k:'rdl',n:'Peso muerto rumano',u:'kg'},{k:'lsit',n:'L-sit',u:'seg'},{k:'handstand',n:'Handstand',u:'seg'}];
var SKILLS=[{k:'handstand',n:'Handstand'},{k:'hspu',n:'Fondos invertidos (HSPU)'},{k:'muscleup',n:'Muscle-up'},{k:'frontlever',n:'Front lever'},{k:'backlever',n:'Back lever'},{k:'planche',n:'Planche'},{k:'humanflag',n:'Bandera humana'},{k:'onearm',n:'Dominada a un brazo'},{k:'hswalk',n:'Caminata de manos'},{k:'pistol',n:'Pistol squat'},{k:'dragon',n:'Dragon flag'},{k:'lsit',n:'L-sit'}];
var GROUPS=['Pecho','Espalda','Trapecios','Hombros','Bíceps','Tríceps','Antebrazos','Cuádriceps','Femorales','Glúteos','Pantorrillas','Core','Cuello','Skills','Explosividad','Acondicionamiento'];
/* 13 meses: empieza en ABRIL, cierra en MARZO (último). Sol = 27 jun–24 jul. Cada mes su emoji. */

var S=DB.get('olimpo:state',null);
if(!S){S={cyclePos:0,favs:[],done:{},sessions:{},components:0,logs:{},rings:{F:0,C:0,R:0,X:0,U:0},skills:{},custom:[]};save();}
if(!S.sessions)S.sessions={}; if(S.components==null)S.components=0;
if(!S.clean1){if(S.logs&&S.logs.dips){S.logs.dips=S.logs.dips.filter(function(l){return !((l.v===25&&(l.w||0)===0)||(l.v===10&&(l.w||0)===10));});if(!S.logs.dips.length)delete S.logs.dips;}S.clean1=true;save();}
if(S.unitPref==null)S.unitPref='kg';
if(!S.clean2){
  for(var mbk in S.logs){
    var mdef=(BASE.filter(function(x){return x.k===mbk;})[0])||{};
    S.logs[mbk]=(S.logs[mbk]||[]).map(function(l){
      if(l.sets)return l;
      if(mdef.u==='kg')return {d:l.d,sets:[],weightKg:(l.v||0)};
      return {d:l.d,sets:[l.v||0],weightKg:l.w||null};
    });
  }
  S.clean2=true;save();
}
if(!S.baseSel)S.baseSel={};
if(!S.habits)S.habits=[];
if(!S.habitLog)S.habitLog={};
function save(){DB.set('olimpo:state',S);}
function allEx(){return EX.concat(S.custom.map(function(c,i){return {id:1000+i,n:c.n,a:c.a||[],g:c.g,e:c.e||'—',t:'C',tip:c.tip||'',base:0,q:[],cust:1};}));}

function todayKey(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return (n<10?'0':'')+n;}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1900);}
function trainedDays(){return Object.keys(S.sessions);}
function xp(){var pr=0;for(var k in S.logs)pr+=S.logs[k].length;var sk=0;for(var s in S.skills){if(S.skills[s]==='done')sk++;}return S.components*8+pr*6+sk*15;}
function allRingsFull(){return QUAL.every(function(q){return (S.rings[q.k]||0)>=100;});}
function level(){var x=xp(),lv=LEVELS[0],i;for(i=0;i<LEVELS.length-1;i++){if(x>=LEVELS[i].x)lv=LEVELS[i];}if(allRingsFull()&&(S.components>=5000||streak()>=3650))lv=LEVELS[5];var idx=LEVELS.indexOf(lv);return {lv:lv,idx:idx,next:LEVELS[idx+1],x:x};}
function streak(){var days=trainedDays();if(!days.length)return 0;var set={};days.forEach(function(d){set[d]=1;});var c=0,d=new Date();if(!set[todayKey()])d.setDate(d.getDate()-1);for(var i=0;i<3650;i++){var k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());if(set[k]){c++;d.setDate(d.getDate()-1);}else break;}return c;}
function cyclesDone(){return Math.floor(S.components/4);}

var route='hoy',calMonth=null,libGroup='Todos',libQuery='',actExpanded=false,rangosExpanded=false,habitsEditMode=false;
function render(){
  var v=document.getElementById('view');v.className='fade';
  if(route==='hoy')v.innerHTML=viewHoy();else if(route==='lib')v.innerHTML=viewLib();else if(route==='prog')v.innerHTML=viewProg();else if(route==='cal')v.innerHTML=viewCal();else if(route==='hist')v.innerHTML=viewHist();
  var lo=level();document.getElementById('topBadge').innerHTML='<span>'+lo.lv.e+'</span> <b>'+lo.lv.n+'</b> · ⟳'+cyclesDone()+' · 🔥'+streak();
  renderNav();void v.offsetWidth;v.className='fade';
}
function renderNav(){var items=[['hoy','◎','Hoy'],['hist','≡','Historial'],['prog','◆','Progreso'],['cal','▦','Calendario']];
  document.getElementById('nav').innerHTML=items.map(function(it){return '<button class="nav-b2 '+(route===it[0]?'on':'')+'" data-nav="'+it[0]+'"><span class="ic">'+it[1]+'</span><span>'+it[2]+'</span></button>';}).join('');}

function viewHoy(){
  var day=CYCLE[S.cyclePos];var tk=todayKey();var doneToday=S.done[tk]||[];
  var groupsEx=allEx().filter(function(e){return day.groups.indexOf(e.g)>=0;});
  var favEx=groupsEx.filter(function(e){return S.favs.indexOf(e.id)>=0;});
  var list=favEx.length?favEx:groupsEx.filter(function(e){return e.base;});
  var inCycle=S.components%4;
  var h='<h2 class="view-t">Hoy</h2><div class="view-s">'+new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+'</div>';
  h+='<div class="card acc"><div class="today-hd"><div><div class="dk">Ciclo #'+(cyclesDone()+1)+' · componente '+(S.cyclePos+1)+'/4</div><div class="dn">'+day.n+'</div><div class="ds">'+day.sub+'</div></div><button class="btn sm gho" data-act="cycle">Cambiar ↺</button></div>'+
     '<div class="cyc-dots">'+[0,1,2,3].map(function(i){return '<i class="'+(i<inCycle?'on':'')+'"></i>';}).join('')+'</div>'+
     '<div class="dim" style="font-size:10.5px;margin-top:9px;line-height:1.5">El componente avanza al presionar "Completar" — no cambia según la fecha del calendario.</div></div>';
  h+=viewHabits();
  h+='<div class="card"><div class="c-head" data-act="toggleact" style="cursor:pointer;margin-bottom:'+(actExpanded?'12px':'0')+'"><div class="ey">Activación</div><span class="dim" style="font-size:13px">'+(actExpanded?'Ocultar −':'Ver +')+'</span></div>';
  if(actExpanded)h+='<div class="warm"><span class="k">1</span><div>Sube temperatura — remadora / battle rope / jumping jacks hasta encender el cuerpo</div></div>'+
     '<div class="warm"><span class="k">2</span><div>Movilidad dinámica del patrón del día — hombros, cadera, torácica, muñecas</div></div>'+
     '<div class="warm"><span class="k">3</span><div>Series de aproximación a la base — ligero → medio → cerca del peso real, sin fatigarte</div></div>';
  h+='</div>';
  h+='<div class="card acc"><div class="ey" style="margin-bottom:4px">Base</div>';
  day.base.forEach(function(bn,idx){var effN=S.baseSel[day.k+'|'+idx]||bn;var bk=matchBase(effN);var last=bk&&S.logs[bk]&&S.logs[bk].length?S.logs[bk][S.logs[bk].length-1]:null;
    h+='<div class="base-log"><span class="bn">'+effN+'</span>'+(last?'<span class="bv">'+fmtLog(last,bk)+'</span>':'')+(bk?'<button class="btn sm" data-log="'+bk+'">Registrar</button>':'')+'<button class="btn sm gho" data-basepick="'+day.k+'|'+idx+'" style="padding:8px 9px" aria-label="Cambiar base">⇄</button></div>';});
  h+='</div>';
  h+='<div class="card"><div class="c-head"><div class="ey">Rutina de hoy</div><span class="dim" style="font-size:11px">'+doneToday.length+'/'+list.length+'</span></div>';
  if(!list.length)h+='<div class="empty">Marca ejercicios ⭐ en La Biblioteca y aparecerán aquí para tu '+day.n+'.</div>';
  else list.forEach(function(e){var dn=doneToday.indexOf(e.id)>=0;h+='<div class="exrow '+(dn?'done':'')+'"><div class="chk '+(dn?'on':'')+'" data-check="'+e.id+'">'+(dn?'✓':'')+'</div><div class="en">'+e.n+'</div><div class="eg">'+e.g+'</div></div>';});
  h+='<button class="btn sm gho full" data-nav="lib" style="margin-top:10px">＋ Agregar ejercicios (Biblioteca)</button>';
  h+='</div>';
  h+='<button class="btn pri full" data-act="complete">Completar '+day.n+' ✓</button>';
  h+='<div class="dim" style="font-size:11px;text-align:center;padding:10px 8px">Puedes completar más de un componente en un día para avanzar el ciclo más rápido.</div>';
  return h;
}
function viewHabits(){
  var tk=todayKey();var log=S.habitLog[tk]||{};
  var h='<div class="card"><div class="c-head"><div class="ey">Hábitos</div><button class="btn sm gho" data-act="togglehabitedit" style="padding:6px 10px;font-size:11px">'+(habitsEditMode?'Listo':'Editar')+'</button></div>';
  if(!S.habits.length)h+='<div class="empty" style="padding:6px 4px">Agrega hábitos para trackear — agua, pasos, lectura…</div>';
  else S.habits.forEach(function(hb){var v=log[hb.id]||0;
    h+='<div class="exrow"><div class="en" data-habitset="'+hb.id+'" style="cursor:pointer">'+hb.n+'<div class="dim" style="font-size:10px;margin-top:2px">'+v+' / '+hb.goal+' '+hb.unit+'</div></div>'+
      (habitsEditMode?'<button class="btn sm gho" data-habitdel="'+hb.id+'" style="padding:7px 11px">✕</button>':'<button class="btn sm" data-habitinc="'+hb.id+'" style="padding:8px 12px">+1</button>')+'</div>';
  });
  h+='<button class="btn sm gho full" data-act="addhabit" style="margin-top:10px">＋ Agregar hábito</button></div>';
  return h;
}
function habitInc(id){var tk=todayKey();S.habitLog[tk]=S.habitLog[tk]||{};S.habitLog[tk][id]=(S.habitLog[tk][id]||0)+1;save();render();}
function habitSetExact(id){var hb=S.habits.filter(function(h){return h.id===id;})[0];if(!hb)return;var tk=todayKey();var curr=(S.habitLog[tk]||{})[id]||0;var v=prompt('Valor de hoy — '+hb.n+' ('+hb.unit+'):',curr);if(v===null)return;v=parseFloat(v);if(isNaN(v)||v<0)return;S.habitLog[tk]=S.habitLog[tk]||{};S.habitLog[tk][id]=v;save();render();}

function pickBaseExercise(ck,idx){

  var seen={};var candidates=allEx().filter(function(e){if(day.groups.indexOf(e.g)<0)return false;if(!(e.base||S.favs.indexOf(e.id)>=0))return false;if(seen[e.n])return false;seen[e.n]=1;return true;});
  var names=candidates.map(function(e){return e.n;});

var KG2LB=2.20462;
function fmtWeight(kg){if(!kg)return '0 kg';return S.unitPref==='lb'?(Math.round(kg*KG2LB*10)/10)+' lb':(Math.round(kg*10)/10)+' kg';}
function maxSet(l){return l&&l.sets&&l.sets.length?Math.max.apply(null,l.sets):null;}

function bestOf(k){var log=S.logs[k]||[];if(!log.length)return null;var u=(BASE.filter(function(b){return b.k===k;})[0]||{}).u;var best=log[0];log.forEach(function(l){var ls=(maxSet(l)||0)+(l.weightKg||0)*3,bs=(maxSet(best)||0)+(best.weightKg||0)*3;if(u==='kg'){if((l.weightKg||0)>(best.weightKg||0))best=l;}else if(ls>bs)best=l;});return best;}
function logsOnDate(dk){var out=[];for(var bk in S.logs){(S.logs[bk]||[]).forEach(function(l){if(l.d===dk)out.push({bk:bk,l:l});});}return out;}

function olimpoYearAnchor(d){var y=d.getFullYear();var start=new Date(y,3,4);return d>=start?y:y-1;}
function monthStart(Y,mi){var m=MONTHS[mi];return new Date(Y+(m.ny?1:0),m.sm-1,m.sd);}
function olimpoOf(dstr){var d=new Date(dstr+'T00:00:00');var Y=olimpoYearAnchor(d);for(var mi=0;mi<13;mi++){var s=monthStart(Y,mi);var e=new Date(s);e.setDate(e.getDate()+27);if(d>=s&&d<=e){return {mi:mi,day:Math.round((d-s)/86400000)+1,Y:Y};}}return null;}
function viewCal(){
  var now=new Date();var curr=olimpoOf(todayKey());var Y=curr?curr.Y:olimpoYearAnchor(now);
  if(calMonth===null)calMonth=curr?curr.mi:0;
  var m=MONTHS[calMonth];var s=monthStart(Y,calMonth);
  var compByDay={};var counts={};
  for(var dk in S.sessions){var o=olimpoOf(dk);if(o&&o.Y===Y){counts[o.mi]=(counts[o.mi]||0)+1;if(o.mi===calMonth){compByDay[o.day]=S.sessions[dk].map(function(c){return (CYCLE.filter(function(x){return x.k===c;})[0]||{i:'·'}).i;}).join('');}}}

  for(var day=1;day<=28;day++){var isTod=curr&&curr.mi===calMonth&&curr.day===day;var tr=compByDay[day];var cellD=new Date(s);cellD.setDate(cellD.getDate()+(day-1));var dk=cellD.getFullYear()+'-'+p2(cellD.getMonth()+1)+'-'+p2(cellD.getDate());h+='<div class="cd '+(tr?'tr':'')+' '+(isTod?'tod':'')+'" data-day="'+dk+'"><span class="num">'+day+'</span>'+(tr?'<span class="cmp">'+tr+'</span>':'')+'</div>';}
  h+='</div><div class="legend"><span>E · empuje</span><span>J · jale</span><span>P · piernas</span><span>C · control</span></div></div>';
  h+='<div class="card"><div class="ey" style="margin-bottom:12px">El año · sesiones por mes</div><div class="ystrip">';

  return h;

function fmtRange(s){var e=new Date(s);e.setDate(e.getDate()+27);var mo=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return s.getDate()+' '+mo[s.getMonth()]+' – '+e.getDate()+' '+mo[e.getMonth()];}
function fmtDateEs(dk){var d=new Date(dk+'T00:00:00');return d.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});}
function viewHist(){
  var dset={};Object.keys(S.sessions).forEach(function(d){dset[d]=1;});for(var bk0 in S.logs){(S.logs[bk0]||[]).forEach(function(l){dset[l.d]=1;});}
  var days=Object.keys(dset).sort().reverse();

  days.forEach(function(dk){

  if(t.dataset.act==='togglerangos'){rangosExpanded=!rangosExpanded;render();return;}

  if(t.dataset.act==='addex'){addExercise();return;}

  root.querySelectorAll('[data-unit]').forEach(function(btn){btn.onclick=function(){root.querySelectorAll('[data-unit]').forEach(function(x){x.classList.remove('on');});btn.classList.add('on');S.unitPref=btn.dataset.unit;updateConv();};});
  root.querySelector('#addSetBtn').onclick=function(){var vals=Array.prototype.map.call(root.querySelectorAll('.setInput'),function(inp){return inp.value;});var wv=wInput?wInput.value:null;renderLogModal(setsCount+1);var newRoot=document.getElementById('modalRoot');vals.forEach(function(v,i){var inp=newRoot.querySelectorAll('.setInput')[i];if(inp)inp.value=v;});if(wv&&newRoot.querySelector('#weightInput'))newRoot.querySelector('#weightInput').value=wv;};
  root.querySelectorAll('[data-rmset]').forEach(function(btn){btn.onclick=function(){if(setsCount<=1)return;var idx=+btn.dataset.rmset;var vals=Array.prototype.map.call(root.querySelectorAll('.setInput'),function(inp){return inp.value;});vals.splice(idx,1);var wv=wInput?wInput.value:null;renderLogModal(setsCount-1);var newRoot=document.getElementById('modalRoot');vals.forEach(function(v,i){var inp=newRoot.querySelectorAll('.setInput')[i];if(inp)inp.value=v;});if(wv&&newRoot.querySelector('#weightInput'))newRoot.querySelector('#weightInput').value=wv;};});
  root.querySelector('#saveLogBtn').onclick=saveLogModal;
}
function saveLogModal(){
  var bk=logModalBk;var b=(BASE.filter(function(x){return x.k===bk;})[0]||{});
  var setEls=document.querySelectorAll('.setInput');var sets=[];
  Array.prototype.forEach.call(setEls,function(inp){var v=parseFloat(inp.value);if(!isNaN(v)&&v>0)sets.push(v);});
  if(!sets.length){toast('Ingresa al menos una serie');return;}
  var weightKg=null,wInput=document.getElementById('weightInput');
  if(wInput){var wv=parseFloat(wInput.value);if(!isNaN(wv)&&wv>0){var unit=(document.querySelector('.pill.on')||{dataset:{unit:'kg'}}).dataset.unit;weightKg=unit==='lb'?wv/KG2LB:wv;}}
  var prev=bestOf(bk);
  S.logs[bk]=S.logs[bk]||[];
  S.logs[bk].push({d:todayKey(),sets:sets,weightKg:weightKg});
  var now=bestOf(bk);
  function score(l){if(!l)return -1;var ms=maxSet(l)||0;return b.u==='kg'?(l.weightKg||0):(ms+(l.weightKg||0)*3);}
  var isPR=!prev||score(now)>score(prev);
  bump('F',isPR?4:2);save();closeLogModal();
  var total=sets.reduce(function(a,c){return a+c;},0);
  toast((isPR?'💥 ¡Nuevo récord! ':'Registrado — ')+sets.length+' serie'+(sets.length>1?'s':'')+' · total '+total+(b.u==='seg'?' seg':' reps'));
  render();
}
function addExercise(){var n=prompt('Nombre del ejercicio:');if(!n)return;var g=prompt('Grupo ('+GROUPS.join(', ')+'):','Antebrazos')||'Otros';var a=prompt('Otros nombres / alias (coma)? — opcional:');var tip=prompt('Tip corto? — opcional:');S.custom.push({n:n,g:g,a:a?a.split(',').map(function(x){return x.trim();}):[],tip:tip||''});save();toast('＋ Ejercicio agregado');render();}
function completeSession(){var tk=todayKey();var day=CYCLE[S.cyclePos];S.sessions[tk]=(S.sessions[tk]||[]).concat([day.k]);S.components++;day.ql.forEach(function(q){bump(q,3);});bump('U',1);S.cyclePos=(S.cyclePos+1)%4;save();var cyc=cyclesDone();toast('🧱 '+day.n+' completado'+(S.components%4===0?' · ⟳ ¡Ciclo '+cyc+' cerrado!':''));render();}

render();
</script>
